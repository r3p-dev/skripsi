<!doctype html>
<!--
  Served by the service worker when a page load cannot reach the server. It has
  to stand on its own: no build assets, no fonts, no images beyond the icon that
  the worker precaches alongside this file.
-->
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>Tidak ada koneksi — UmimaClean</title>
    <link rel="icon" href="/icons/favicon-96x96.png" type="image/png" />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background: #fff;
        color: #141414;
        font-family:
          'Roboto',
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      main {
        width: 100%;
        max-width: 28rem;
        text-align: center;
      }

      img {
        width: 4rem;
        height: 4rem;
        border-radius: 1.1rem;
      }

      h1 {
        margin: 1.5rem 0 0.5rem;
        font-size: 1.375rem;
        font-weight: 700;
        letter-spacing: -0.01em;
      }

      p {
        margin: 0;
        color: #6b6b6b;
        font-size: 0.9375rem;
      }

      button {
        margin-top: 1.75rem;
        width: 100%;
        min-height: 2.75rem;
        padding: 0.75rem 1.25rem;
        border: 0;
        border-radius: 0.45rem;
        background: #141414;
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.1s ease;
      }

      button:active {
        transform: scale(0.97);
      }

      small {
        display: block;
        margin-top: 1rem;
        color: #9a9a9a;
        font-size: 0.8125rem;
      }
    </style>
  </head>

  <body>
    <main>
      <img src="/icons/web-app-manifest-192x192.png" alt="UmimaClean" width="192" height="192" />

      <h1>Tidak ada koneksi</h1>
      <p>
        Ponsel Anda sedang tidak terhubung ke internet, jadi halaman ini belum bisa dimuat. Periksa
        koneksi Anda lalu coba lagi.
      </p>

      <button type="button" onclick="location.reload()">Coba lagi</button>

      <small>Halaman akan dimuat ulang otomatis saat koneksi kembali.</small>
    </main>

    <script>
      addEventListener('online', () => location.reload())
    </script>
  </body>
</html>
