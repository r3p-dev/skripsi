<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<style>
  body{margin:0;background:#e9e9e7;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif}
  a{color:#111;text-decoration:none}
  a:hover{color:#555}
  input{font-family:inherit}
  input::placeholder{color:#8c8c8c}
  #shell{max-width:430px}
  @media (min-width:680px){#shell{max-width:680px!important;margin:56px auto!important;min-height:auto!important;border:1px solid rgba(0,0,0,.08)!important;border-radius:6px!important;box-shadow:0 24px 64px rgba(0,0,0,.08)!important}}
  @media (min-width:1000px){#shell{max-width:760px!important}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}
</style>
</helmet>
<div id="shell" style="max-width:430px;margin:0 auto;background:#fff;color:#111;min-height:100vh;box-sizing:border-box">

  <header style="display:flex;justify-content:space-between;padding:24px clamp(24px,4vw,64px) 0">
    <a href="Umima Landing.dc.html" style="font:400 clamp(12px,0.85vw + 9px,14px)/1.4 system-ui;color:#707070;letter-spacing:.04em">← Kembali</a>
    <span style="font:400 clamp(10px,0.75vw + 8px,12px)/1.4 system-ui;letter-spacing:.14em;text-transform:uppercase;color:#8c8c8c">Internal</span>
  </header>

  <main>

  <div style="display:flex;flex-direction:column;align-items:center;text-align:center;padding:32px clamp(24px,4vw,64px) 40px">
    <img src="assets/umima-logo.jpg" alt="ümima" style="width:130px;object-fit:contain;margin-bottom:28px">
    <h2 style="margin:0 0 16px 0;font:400 clamp(11px,0.8vw + 9px,13px)/1.4 system-ui;letter-spacing:.2em;text-transform:uppercase;color:#5f5f5f">Portal Internal</h2>
    <h1 style="margin:0 0 8px 0;font:600 clamp(20px,1.5vw + 14px,27px)/1.4 system-ui;color:#111">Masuk Staf & Admin</h1>
    <div style="font:400 clamp(13px,0.9vw + 10px,15px)/1.6 system-ui;color:#5f5f5f;max-width:260px">Khusus untuk tim operasional dan admin ümima.</div>
  </div>

  <div style="padding:0 clamp(24px,4vw,64px)">
    <div style="margin-bottom:24px">
      <label for="staff-id-input" style="display:block;font:400 clamp(11px,0.8vw + 9px,13px)/1.4 system-ui;letter-spacing:.14em;text-transform:uppercase;color:#5f5f5f;margin-bottom:10px">Username atau Email</label>
      <input id="staff-id-input" type="text" placeholder="staf@umima.id" style="width:100%;box-sizing:border-box;border:none;border-bottom:1px solid rgba(0,0,0,.2);padding:10px 0;font-size:15px;color:#111;background:transparent;outline:none" style-focus="outline:2px solid #111;outline-offset:2px">
    </div>
    <div style="margin-bottom:12px">
      <label for="staff-pass-input" style="display:block;font:400 clamp(11px,0.8vw + 9px,13px)/1.4 system-ui;letter-spacing:.14em;text-transform:uppercase;color:#5f5f5f;margin-bottom:10px">Kata Sandi</label>
      <input id="staff-pass-input" type="password" placeholder="••••••••" style="width:100%;box-sizing:border-box;border:none;border-bottom:1px solid rgba(0,0,0,.2);padding:10px 0;font-size:15px;color:#111;background:transparent;outline:none" style-focus="outline:2px solid #111;outline-offset:2px">
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:32px">
      <label style="display:flex;align-items:center;gap:8px;font:400 clamp(13px,0.9vw + 10px,15px)/1.4 system-ui;color:#333;cursor:pointer">
        <input type="checkbox" style="width:16px;height:16px;accent-color:#111;margin:0">
        Ingat saya
      </label>
      <a href="#" style="font:400 clamp(12px,0.85vw + 9px,14px)/1.4 system-ui;color:#707070">Lupa kata sandi?</a>
    </div>

    <a href="#" style="display:flex;justify-content:center;padding:17px;background:#111;color:#fff;font:500 clamp(13px,0.9vw + 10px,15px)/1 system-ui;letter-spacing:.08em;text-transform:uppercase;margin-bottom:40px">Masuk</a>
  </div>

  </main>
  <footer style="text-align:center;padding-bottom:48px">
    <div style="font:400 clamp(12px,0.85vw + 9px,14px)/1.6 system-ui;color:#707070">Bandung, Jawa Barat</div>
  </footer>

</div>

</x-dc>
</body>
</html>
