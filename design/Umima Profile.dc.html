<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<style>
  body{margin:0;background:#e9e9e7;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif}
  a{color:#111;text-decoration:none}
  a:hover{color:#555}
  input{font-family:inherit}
  #shell{max-width:430px}
  @media (min-width:680px){#shell{max-width:680px!important;margin:56px auto!important;min-height:auto!important;border:1px solid rgba(0,0,0,.08)!important;border-radius:6px!important;box-shadow:0 24px 64px rgba(0,0,0,.08)!important}}
  @media (min-width:1000px){#shell{max-width:760px!important}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}
</style>
</helmet>
<div id="shell" style="max-width:430px;margin:0 auto;background:#fff;color:#111;min-height:100vh;box-sizing:border-box">

  <header style="padding:24px clamp(24px,4vw,64px) 0">
    <a href="Umima Login.dc.html" style="font:400 clamp(12px,0.85vw + 9px,14px)/1.4 system-ui;color:#707070;letter-spacing:.04em">← Kembali</a>
  </header>

  <main>

  <div style="padding:28px clamp(24px,4vw,64px) 8px">
    <div style="font:600 clamp(20px,1.5vw + 14px,27px)/1.4 system-ui;color:#111;margin-bottom:6px">Profil Saya</div>
    <div style="font:400 clamp(13px,0.9vw + 10px,15px)/1.6 system-ui;color:#5f5f5f">Kelola informasi akun Anda.</div>
  </div>

  <div style="padding:24px clamp(24px,4vw,64px) 0">
    <h2 style="margin:0 0 8px 0;font:400 clamp(11px,0.8vw + 9px,13px)/1.4 system-ui;letter-spacing:.2em;text-transform:uppercase;color:#5f5f5f">Informasi Akun</h2>

    <div style="padding:16px 0;border-bottom:1px solid rgba(0,0,0,.08)">
      <label for="profile-name-input" style="display:block;font:400 clamp(11px,0.8vw + 9px,13px)/1.4 system-ui;letter-spacing:.1em;text-transform:uppercase;color:#707070;margin-bottom:8px">Nama</label>
      <sc-if value="{{notEditingName}}" hint-placeholder-val="{{true}}">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span style="font:400 clamp(15px,1vw + 11px,17px)/1.4 system-ui;color:#111">{{name}}</span>
          <button type="button" onClick="{{onNameEditStart}}" aria-label="Ubah nama" style="font:400 clamp(12px,0.85vw + 9px,14px)/1.4 system-ui;color:#666;background:none;border:none;padding:0;cursor:pointer;font-family:inherit">Ubah</button>
        </div>
      </sc-if>
      <sc-if value="{{editingName}}" hint-placeholder-val="{{false}}">
        <div style="display:flex;gap:10px;align-items:center">
          <input id="profile-name-input" value="{{draftName}}" onChange="{{onNameChange}}" style="flex:1;border:none;border-bottom:1px solid #111;padding:6px 0;font-size:15px;outline:none;background:transparent" style-focus="outline:2px solid #111;outline-offset:2px">
          <button type="button" onClick="{{onNameSave}}" style="font:500 clamp(12px,0.85vw + 9px,14px)/1.4 system-ui;color:#111;background:none;border:none;padding:0;cursor:pointer;font-family:inherit">Simpan</button>
          <button type="button" onClick="{{onNameCancel}}" style="font:400 clamp(12px,0.85vw + 9px,14px)/1.4 system-ui;color:#707070;background:none;border:none;padding:0;cursor:pointer;font-family:inherit">Batal</button>
        </div>
      </sc-if>
    </div>

    <div style="padding:16px 0;border-bottom:1px solid rgba(0,0,0,.08)">
      <label for="profile-phone-input" style="display:block;font:400 clamp(11px,0.8vw + 9px,13px)/1.4 system-ui;letter-spacing:.1em;text-transform:uppercase;color:#707070;margin-bottom:8px">No. HP</label>
      <sc-if value="{{notEditingPhone}}" hint-placeholder-val="{{true}}">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span style="font:400 clamp(15px,1vw + 11px,17px)/1.4 system-ui;color:#111">{{phone}}</span>
          <button type="button" onClick="{{onPhoneEditStart}}" aria-label="Ubah nomor HP" style="font:400 clamp(12px,0.85vw + 9px,14px)/1.4 system-ui;color:#666;background:none;border:none;padding:0;cursor:pointer;font-family:inherit">Ubah</button>
        </div>
      </sc-if>
      <sc-if value="{{editingPhone}}" hint-placeholder-val="{{false}}">
        <div style="display:flex;gap:10px;align-items:center">
          <input id="profile-phone-input" value="{{draftPhone}}" onChange="{{onPhoneChange}}" style="flex:1;border:none;border-bottom:1px solid #111;padding:6px 0;font-size:15px;outline:none;background:transparent" style-focus="outline:2px solid #111;outline-offset:2px">
          <button type="button" onClick="{{onPhoneSave}}" style="font:500 clamp(12px,0.85vw + 9px,14px)/1.4 system-ui;color:#111;background:none;border:none;padding:0;cursor:pointer;font-family:inherit">Simpan</button>
          <button type="button" onClick="{{onPhoneCancel}}" style="font:400 clamp(12px,0.85vw + 9px,14px)/1.4 system-ui;color:#707070;background:none;border:none;padding:0;cursor:pointer;font-family:inherit">Batal</button>
        </div>
      </sc-if>
    </div>

    <div style="padding:16px 0;border-bottom:1px solid rgba(0,0,0,.08)">
      <label for="profile-password-input" style="display:block;font:400 clamp(11px,0.8vw + 9px,13px)/1.4 system-ui;letter-spacing:.1em;text-transform:uppercase;color:#707070;margin-bottom:8px">Kata Sandi</label>
      <sc-if value="{{notEditingPassword}}" hint-placeholder-val="{{true}}">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span style="font:400 clamp(15px,1vw + 11px,17px)/1.4 system-ui;color:#111;letter-spacing:.1em">••••••••</span>
          <button type="button" onClick="{{onPasswordEditStart}}" aria-label="Ubah kata sandi" style="font:400 clamp(12px,0.85vw + 9px,14px)/1.4 system-ui;color:#666;background:none;border:none;padding:0;cursor:pointer;font-family:inherit">Ubah</button>
        </div>
      </sc-if>
      <sc-if value="{{editingPassword}}" hint-placeholder-val="{{false}}">
        <div style="display:flex;gap:10px;align-items:center">
          <input id="profile-password-input" type="password" placeholder="Kata sandi baru" value="{{draftPassword}}" onChange="{{onPasswordChange}}" style="flex:1;border:none;border-bottom:1px solid #111;padding:6px 0;font-size:15px;outline:none;background:transparent" style-focus="outline:2px solid #111;outline-offset:2px">
          <button type="button" onClick="{{onPasswordSave}}" style="font:500 clamp(12px,0.85vw + 9px,14px)/1.4 system-ui;color:#111;background:none;border:none;padding:0;cursor:pointer;font-family:inherit">Simpan</button>
          <button type="button" onClick="{{onPasswordCancel}}" style="font:400 clamp(12px,0.85vw + 9px,14px)/1.4 system-ui;color:#707070;background:none;border:none;padding:0;cursor:pointer;font-family:inherit">Batal</button>
        </div>
      </sc-if>
    </div>
  </div>

  <div style="padding:32px clamp(24px,4vw,64px) 0">
    <h2 style="margin:0 0 16px 0;font:400 clamp(11px,0.8vw + 9px,13px)/1.4 system-ui;letter-spacing:.2em;text-transform:uppercase;color:#5f5f5f">Alamat</h2>
    <div style="display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border:1px solid rgba(0,0,0,.1)">
      <div>
        <div style="font:600 clamp(14px,1vw + 10px,16px)/1.4 system-ui;color:#111;margin-bottom:4px">Rumah</div>
        <div style="font:400 clamp(13px,0.9vw + 10px,15px)/1.5 system-ui;color:#666">Jl. Margacinta No. 12, Bandung</div>
      </div>
      <a href="Umima Address.dc.html" aria-label="Kelola alamat Rumah" style="font:400 clamp(12px,0.85vw + 9px,14px)/1.4 system-ui;color:#666;white-space:nowrap;margin-left:12px">Kelola →</a>
    </div>
  </div>

  <div style="padding:32px clamp(24px,4vw,64px) 0">
    <h2 style="margin:0 0 16px 0;font:400 clamp(11px,0.8vw + 9px,13px)/1.4 system-ui;letter-spacing:.2em;text-transform:uppercase;color:#5f5f5f">Pesanan</h2>
    <a href="Umima Order Index.dc.html" style="display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border:1px solid rgba(0,0,0,.1);color:#111;font:400 clamp(14px,1vw + 10px,16px)/1.4 system-ui">Riwayat Pesanan<span style="color:#707070">→</span></a>
  </div>

  <div style="padding:40px clamp(24px,4vw,64px) 48px">
    <a href="Umima Landing.dc.html" style="display:flex;justify-content:center;padding:16px;border:1px solid #111;color:#111;font:500 clamp(13px,0.9vw + 10px,15px)/1 system-ui;letter-spacing:.08em;text-transform:uppercase">Keluar</a>
  </div>

</main>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = {
    name: 'Raka Pratama',
    phone: '0812-3456-7890',
    editingName: false,
    editingPhone: false,
    editingPassword: false,
    draftName: '',
    draftPhone: '',
    draftPassword: ''
  };

  renderVals() {
    const s = this.state;
    return {
      name: s.name,
      phone: s.phone,
      editingName: s.editingName,
      notEditingName: !s.editingName,
      editingPhone: s.editingPhone,
      notEditingPhone: !s.editingPhone,
      editingPassword: s.editingPassword,
      notEditingPassword: !s.editingPassword,
      draftName: s.draftName,
      draftPhone: s.draftPhone,
      draftPassword: s.draftPassword,
      onNameEditStart: () => this.setState({ editingName: true, draftName: this.state.name }),
      onNameChange: (e) => this.setState({ draftName: e.target.value }),
      onNameSave: () => this.setState({ name: this.state.draftName || this.state.name, editingName: false }),
      onNameCancel: () => this.setState({ editingName: false }),
      onPhoneEditStart: () => this.setState({ editingPhone: true, draftPhone: this.state.phone }),
      onPhoneChange: (e) => this.setState({ draftPhone: e.target.value }),
      onPhoneSave: () => this.setState({ phone: this.state.draftPhone || this.state.phone, editingPhone: false }),
      onPhoneCancel: () => this.setState({ editingPhone: false }),
      onPasswordEditStart: () => this.setState({ editingPassword: true, draftPassword: '' }),
      onPasswordChange: (e) => this.setState({ draftPassword: e.target.value }),
      onPasswordSave: () => this.setState({ editingPassword: false, draftPassword: '' }),
      onPasswordCancel: () => this.setState({ editingPassword: false, draftPassword: '' })
    };
  }
}
</script>
</body>
</html>
